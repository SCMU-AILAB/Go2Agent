[project]
name = "g1agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Yao0454", email = "yaoyifeng20070524@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "langchain",
    "langchain-ollama",
    "pip>=26.2.1",
    "pydantic>=2.13.5",
    "ruff>=0.16.5",
    "uvicorn[standard]",
]

[project.optional-dependencies]
perception = [
    "numpy",
    "opencv-python-headless>=4.8,<5",
    "pyrealsense2; platform_machine != 'aarch64'",
]
vision = [
    "num2words>=0.5.14",
    "pillow>=10",
    "transformers>=4.49,<5",
]
voice = [
    "faster-whisper>=1.2.1",
    "piper-tts>=1.3.0",
]

[project.scripts]
g1agent = "app.main:main"
g1-perception = "app.perception:main"
g1-wave = "app.wave:main"
g1-api = "app.api:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["agent", "app", "core", "robot", "skills", "adapters", "perception"]
